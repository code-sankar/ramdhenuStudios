<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1d2d3d" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://ramdhenu.studio/" />

    <title>Ramdhenu — Digital agency for local businesses in Assam</title>
    <meta
      name="description"
      content="Ramdhenu is a digital agency for local businesses that want more than a website — websites, photography, social media, Google Business and paid campaigns, from one coordinated team."
    />
    <meta name="author" content="Ramdhenu" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ramdhenu.studio/" />
    <meta property="og:site_name" content="Ramdhenu" />
    <meta property="og:title" content="Ramdhenu — A step towards digital presence" />
    <meta
      property="og:description"
      content="Strategy, visuals and campaigns from one coordinated team, built to turn attention into customers."
    />
    <meta property="og:image" content="https://ramdhenu.studio/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Ramdhenu — A step towards digital presence" />
    <meta
      name="twitter:description"
      content="Strategy, visuals and campaigns from one coordinated team, built to turn attention into customers."
    />
    <meta name="twitter:image" content="https://ramdhenu.studio/og-image.svg" />

    <!-- Barlow Condensed over Barlow, self-hosted from /public/fonts.
         See src/styles/fonts.css. Only the Latin faces above the fold
         are preloaded. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-condensed-600-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-400-latin.woff2" crossorigin />

    <!-- The hero fills the first screen with the steel field; paint it before
         React mounts so there is no paper-white flash. -->
    <style>
      html { background-color: #1d2d3d; }
    </style>

    <!--
      Structured data. LocalBusiness (not just Organization) is what earns the
      knowledge panel and Maps treatment a local agency depends on — it is the
      same surface the Google Business service sells to clients.
      ⚠ Keep telephone, email, address and sameAs in step with src/data/site.js.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Ramdhenu",
        "description": "Digital agency for local businesses — websites, photography, social media, Google Business and paid campaigns.",
        "slogan": "A step towards digital presence",
        "url": "https://ramdhenu.studio/",
        "image": "https://ramdhenu.studio/og-image.svg",
        "telephone": "+91 98765 43210",
        "email": "hello@ramdhenu.studio",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Guwahati",
          "addressRegion": "Assam",
          "addressCountry": "IN"
        },
        "areaServed": { "@type": "State", "name": "Assam" },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "10:00",
            "closes": "19:00"
          }
        ],
        "hasOfferCatalog": {
          "@type": "OfferCatalog",
          "name": "Services",
          "itemListElement": [
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design & Development" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Photography & Videography" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Social Media Management" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Performance Marketing" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Google Business Management" } },
            { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Graphic Design & Branding" } }
          ]
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
