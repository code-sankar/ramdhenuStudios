<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#d83a25" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--seo:start-->
    <!--
      Everything between these markers belongs to a route, not to this file.

      src/data/seo.js describes each route's head — title, description,
      canonical, social cards and JSON-LD — and two things read it:
      src/components/Seo.jsx applies it as you navigate, and
      scripts/generate-static-routes.mjs writes it into the built HTML for
      every route, replacing this block. What is here is the dev-server
      fallback, and what a request for an unknown path falls back to.
    -->
    <title>Ramdhenu — A step towards digital presence</title>
    <!--seo:end-->

    <!-- Barlow Condensed over Barlow, self-hosted from /public/fonts.
         See src/styles/fonts.css. Only the Latin faces above the fold
         are preloaded. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-condensed-600-latin.woff2" crossorigin />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/barlow-400-latin.woff2" crossorigin />

    <!-- The boot film. Default priority, not low: the splash now holds for it,
         so the sooner it arrives the shorter the wait. The app bundle loads
         behind the splash and has the film's whole runtime to finish in. -->
    <link rel="preload" as="video" href="/loadingVid.mp4" />

    <!-- The hero fills the first screen with the steel field; paint it before
         React mounts so there is no paper-white flash. -->
    <style>
      html { background-color: #d83a25; }
    </style>

  </head>
  <body>
    <!-- ══════════════════════════════════════════════════════════════════════
         BOOT SPLASH
         ---------------------------------------------------------------------
         Markup and styles live here, in the document, rather than in a React
         component. A component cannot paint until the bundle has parsed, so a
         splash built that way shows the empty page first and the "loading"
         screen second — backwards, and worse than no splash at all. This
         paints on the first frame, before a byte of JavaScript runs.

         THE FILM PLAYS THROUGH. On a first visit the splash holds until the
         video ends, not until the app is ready — the app is usually ready in
         about a second, which would tear the splash down before anyone saw
         it. That is a deliberate cost: it buys the brand moment, and the app
         loads behind the cover it provides.

         IT STILL CANNOT TRAP ANYONE. If the film cannot be decoded, 404s,
         stalls, or autoplay is refused, the splash reverts to dismissing the
         moment the app is ready. A Skip control appears after a beat, and a
         hard ceiling fires whatever else happened. `loop` is deliberately
         absent: with it, `ended` would never fire and the splash would hold
         until the cap every single time.

         The bar is the loading indicator proper. It cannot know real progress
         — no browser API reports "app readiness" — so it eases toward 90% and
         only completes when the splash is actually on its way out.

         Colours are hard-coded because the token sheet has not loaded yet:
         #d83a25 is --color-coral-500 from src/styles/theme.css. If that token
         ever moves, this has to move with it — a splash in the previous brand
         colour is the first thing every new visitor would see.
         ══════════════════════════════════════════════════════════════════════ -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        background: #d83a25;
        display: grid;
        place-items: center;
        transition: opacity 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        /* A fixed, inset-0 box matches the LARGE viewport on a phone, so part
           of it sits behind the browser toolbar. dvh tracks the visible area
           instead; vh stays as the fallback for anything that lacks it. */
        height: 100vh;
        height: 100dvh;
      }
      #boot[data-done] { opacity: 0; pointer-events: none; }
      #boot video {
        width: 100%;
        height: 100%;
        /* THE FIT IS CHOSEN, NOT FIXED — see applyFit() below.
           The film is 16:9. Filling a 360x800 phone with `cover` scales it to
           ~1420px wide inside a 360px window, so three quarters of every frame
           is cropped off the sides and what is left is an unreadable zoom.
           `contain` is the safe default here: it never crops, and JS upgrades
           it to `cover` only on viewports shaped enough like the film that the
           crop is mild. */
        object-fit: contain;
        opacity: 0;
        transition: opacity 0.4s ease-out;
      }
      #boot[data-fit="cover"] video { object-fit: cover; }
      #boot video[data-ready] { opacity: 1; }

      /* CSS-only fallback for the window before metadata arrives, or if it
         never does: fill the screen only where the viewport is already
         landscape-ish. Portrait keeps the uncropped default. */
      @media (min-aspect-ratio: 4 / 3) {
        #boot:not([data-fit]) video { object-fit: cover; }
      }
      /* A held splash with no way past it is hostile, and this is also the
         manual escape hatch if playback stalls somewhere I cannot test. */
      #boot-skip {
        position: absolute;
        /* Clear of a notch, a home indicator, or a phone's bottom toolbar. */
        right: calc(clamp(16px, 4vw, 40px) + env(safe-area-inset-right, 0px));
        bottom: calc(clamp(20px, 4vh, 48px) + env(safe-area-inset-bottom, 0px));
        min-height: 44px;
        padding: 10px 18px;
        font: inherit;
        font-size: 13px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.82);
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.4);
        border-radius: 0;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.3s ease-out, color 0.15s, border-color 0.15s;
      }
      #boot-skip[data-shown] { opacity: 1; }
      #boot-skip:hover { color: #fff; border-color: #fff; }
      #boot-bar {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        height: 2px;
        background: rgba(255, 255, 255, 0.22);
      }
      #boot-bar > i {
        display: block;
        height: 100%;
        width: 0;
        background: #fff;
        transition: width 0.3s ease-out;
      }
      /* Without JavaScript nothing can ever take this down, so it must not go up. */
      @media (prefers-reduced-motion: reduce) { #boot video { display: none; } }
    </style>
    <noscript><style>#boot { display: none !important; }</style></noscript>

    <!-- Not aria-hidden as a whole: the Skip control has to be reachable. The
         decorative parts opt out individually instead. -->
    <div id="boot" role="group" aria-label="Intro">
      <!-- No `loop`: the splash waits for `ended`, which a looping video never
           fires. -->
      <video id="boot-video" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
      <div id="boot-bar" aria-hidden="true"><i></i></div>
      <button id="boot-skip" type="button">Skip</button>
    </div>

    <div id="root"></div>

    <script>
      /* Boot splash controller. Inline and dependency-free so it runs before
         the bundle, and small enough to read in one sitting.

         THE ONE RULE: this must never be the reason someone cannot use the
         site. Every path out — the film ending, a decode failure, autoplay
         refusal, a hostile network, the visitor pressing Skip, JavaScript
         throwing further up — ends in finish(). The hard ceiling fires
         regardless of what else happened. */
      (function () {
        var boot = document.getElementById("boot");
        if (!boot) return;

        var bar = boot.querySelector("#boot-bar > i");
        var video = document.getElementById("boot-video");
        var skip = document.getElementById("boot-skip");

        var MIN_MS = 550;    /* below this the splash reads as a flicker */
        var HARD_MS = 11000; /* absolute ceiling — a stall must never outlive it */
        var SKIP_AT = 1200;  /* the film gets a moment before the exit appears */
        var GRACE_MS = 3000; /* how long the film has to start before we give up */
        var started = Date.now();
        var finished = false;

        /* THE FILM IS A THREE-STATE LIFECYCLE, NOT A BOOLEAN, AND THAT MATTERS.
           The app is typically ready around 130ms; `canplay` does not fire
           until roughly 280ms. A boolean "is it playing" is therefore false at
           the moment the app reports ready, and the splash tore itself down
           before the film ever started — every single time, on a fast
           connection. "pending" is the state that fixes it: ready does nothing
           while the film might still be coming. */
        var film = "pending";  /* "pending" | "playing" | "unavailable" */
        var appIsReady = false;

        function teardown() {
          boot.setAttribute("data-done", "");
          document.documentElement.style.overflow = "";
          window.removeEventListener("resize", applyFit);
          window.removeEventListener("orientationchange", applyFit);
          try { video.removeAttribute("src"); video.load(); } catch (e) { /* already gone */ }
          setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 550);
        }

        /* COVER OR CONTAIN, DECIDED FROM THE ACTUAL NUMBERS.
           `cover` fills the screen but crops whatever does not fit; how much
           it crops depends entirely on how differently the viewport and the
           film are shaped. The fraction of the frame that survives is the
           ratio of the two aspect ratios, so that is what gets measured:

             desktop 1280x800   16:9 film   →  90% visible   → cover
             phone   360x800    16:9 film   →  25% visible   → contain

           Below the threshold the film is letterboxed onto the steel ground
           instead, which is the whole frame, intact, at any screen shape. */
        var MIN_VISIBLE = 0.75;

        function applyFit() {
          if (!video.videoWidth || !video.videoHeight) return;
          var filmAR = video.videoWidth / video.videoHeight;
          var viewAR = (window.innerWidth || 1) / (window.innerHeight || 1);
          var visible = filmAR > viewAR ? viewAR / filmAR : filmAR / viewAR;
          boot.setAttribute("data-fit", visible >= MIN_VISIBLE ? "cover" : "contain");
        }

        function finish() {
          if (finished) return;
          finished = true;
          clearInterval(creep);
          bar.style.width = "100%";
          setTimeout(teardown, Math.max(0, MIN_MS - (Date.now() - started)));
        }

        /* The app being ready is only permission to leave, never the reason.
           It ends the splash only once we know no film is coming. */
        function appReady() {
          appIsReady = true;
          if (film === "unavailable") finish();
        }

        /* No film: a codec this browser cannot decode, a 404, a dead network,
           autoplay refused, or simply too slow to be the intro. From here the
           splash behaves the way it did before — out as soon as the app is up. */
        function filmUnavailable() {
          if (film === "playing") return;
          film = "unavailable";
          if (appIsReady) finish();
        }

        /* Once per session. A client-side router would otherwise replay this
           on navigation, and a splash you have already watched is friction. */
        var seen = false;
        try { seen = sessionStorage.getItem("rd-boot") === "1"; } catch (e) { /* private mode */ }
        var reduced = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (seen) { boot.parentNode.removeChild(boot); return; }
        try { sessionStorage.setItem("rd-boot", "1"); } catch (e) { /* fine */ }

        document.documentElement.style.overflow = "hidden";

        /* Eases toward 90% and stops. Only the exit completes it. */
        var progress = 8;
        bar.style.width = progress + "%";
        var creep = setInterval(function () {
          progress = Math.min(90, progress + (90 - progress) * 0.12 + 0.6);
          bar.style.width = progress + "%";
        }, 180);

        skip.addEventListener("click", finish);
        setTimeout(function () { if (!finished) skip.setAttribute("data-shown", ""); }, SKIP_AT);

        if (reduced) {
          /* No film at all, so there is nothing to hold for. */
          video.removeAttribute("preload");
          filmUnavailable();
        } else {
          video.addEventListener("canplay", function () {
            if (finished) return;
            video.setAttribute("data-ready", "");
            var pending = video.play();
            if (pending && pending.catch) pending.catch(filmUnavailable);
          });

          /* `playing` is the event that means pixels are actually moving —
             more trustworthy than the play() promise alone. */
          video.addEventListener("playing", function () {
            if (!finished) film = "playing";
          });

          /* The film finishing is the intended exit. */
          video.addEventListener("ended", finish);

          /* Belt and braces: if `ended` never arrives — a stall, a seek, a
             browser that drops the event — the film's own duration says when
             it should have. */
          video.addEventListener("loadedmetadata", function () {
            var ms = (video.duration || 0) * 1000;
            if (ms > 0 && isFinite(ms)) setTimeout(finish, ms + 1200);
            applyFit();
          });

          /* Rotating a phone changes the answer, so it is recomputed rather
             than decided once. */
          window.addEventListener("resize", applyFit, { passive: true });
          window.addEventListener("orientationchange", applyFit);

          video.addEventListener("error", filmUnavailable);

          /* A film that has not started within the grace window is not the
             intro any more. Waiting longer would punish exactly the slow
             connections that can least afford it. */
          setTimeout(function () {
            if (film === "pending") filmUnavailable();
          }, GRACE_MS);

          video.src = "/loadingVid.mp4";
        }

        window.__ramdhenuReady = appReady;
        setTimeout(finish, HARD_MS);
        /* Restored from the back/forward cache: never show a stale splash. */
        window.addEventListener("pageshow", function (e) { if (e.persisted) finish(); });
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
